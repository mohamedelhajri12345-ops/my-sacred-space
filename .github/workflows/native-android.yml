name: Native Android APK
on:
  push:
    branches: [native/mobile-foundation]
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Force JS bundle into standalone debug APK
        working-directory: mobile/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if "debuggableVariants = []" not in s:
              s = s.replace("react {", "react {\n    // This APK must run without Metro on a physical device.\n    debuggableVariants = []", 1)
              p.write_text(s)
          PY
          grep -n "debuggableVariants" app/build.gradle
      - name: Build standalone debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-sacred-space-native-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
